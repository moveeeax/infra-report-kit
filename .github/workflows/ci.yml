name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26', '1.27']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # No third-party dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/infra-report ./cmd/infra-report

      - name: Render the shipped example
        run: |
          ./bin/infra-report gen -config examples/acme/acme-2026-06.json -out out
          test -s out/report.html
          test -s out/findings.json

      - name: Upload the rendered example
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'
        uses: actions/upload-artifact@v7
        with:
          name: example-report
          path: out/
          retention-days: 7
